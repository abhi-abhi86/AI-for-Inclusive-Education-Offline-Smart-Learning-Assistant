<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <!-- Teal glow -->
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <!-- Green glow -->
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle background glow rings -->
  <circle cx="256" cy="256" r="200" fill="url(#glowTeal)" opacity="0.5"/>
  <circle cx="256" cy="230" r="130" fill="url(#glowGreen)" opacity="0.3"/>

  <!-- Neural network lines (background) -->
  <!-- Left cluster -->
  <circle cx="110" cy="180" r="7" fill="#38bdf8" opacity="0.5"/>
  <circle cx="110" cy="260" r="7" fill="#38bdf8" opacity="0.5"/>
  <circle cx="110" cy="340" r="7" fill="#38bdf8" opacity="0.5"/>
  <!-- Right cluster -->
  <circle cx="402" cy="180" r="7" fill="#38bdf8" opacity="0.5"/>
  <circle cx="402" cy="260" r="7" fill="#38bdf8" opacity="0.5"/>
  <circle cx="402" cy="340" r="7" fill="#38bdf8" opacity="0.5"/>
  <!-- Middle nodes -->
  <circle cx="185" cy="210" r="6" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="185" cy="300" r="6" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="327" cy="210" r="6" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="327" cy="300" r="6" fill="#7dd3fc" opacity="0.6"/>

  <!-- Connection lines -->
  <line x1="110" y1="180" x2="185" y2="210" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
  <line x1="110" y1="180" x2="185" y2="300" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
  <line x1="110" y1="260" x2="185" y2="210" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
  <line x1="110" y1="260" x2="185" y2="300" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
  <line x1="110" y1="340" x2="185" y2="300" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
  <line x1="402" y1="180" x2="327" y2="210" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
  <line x1="402" y1="260" x2="327" y2="210" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
  <line x1="402" y1="260" x2="327" y2="300" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>
  <line x1="402" y1="340" x2="327" y2="300" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
  <line x1="185" y1="210" x2="327" y2="210" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
  <line x1="185" y1="300" x2="327" y2="300" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>
  <line x1="185" y1="210" x2="327" y2="300" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
  <line x1="185" y1="300" x2="327" y2="210" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>

  <!-- Graduation Cap - brim (wide flat ellipse) -->
  <ellipse cx="256" cy="218" rx="115" ry="22" fill="#38bdf8" filter="url(#glow)" opacity="0.95"/>

  <!-- Graduation Cap - top (square top) -->
  <rect x="186" y="150" width="140" height="78" rx="8" ry="8" fill="#0ea5e9" filter="url(#softGlow)"/>
  <!-- Cap top highlight -->
  <rect x="192" y="156" width="128" height="30" rx="6" ry="6" fill="#7dd3fc" opacity="0.3"/>

  <!-- Cap tassel string -->
  <line x1="256" y1="218" x2="340" y2="218" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
  <line x1="340" y1="218" x2="340" y2="265" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
  <!-- Tassel end -->
  <circle cx="340" cy="265" r="8" fill="#f59e0b"/>
  <line x1="334" y1="273" x2="330" y2="295" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="340" y1="273" x2="340" y2="296" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="346" y1="273" x2="350" y2="295" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Book (open book shape below cap) -->
  <!-- Left page -->
  <path d="M 148 290 Q 148 320 160 345 L 256 340 L 256 290 Z" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
  <!-- Right page -->
  <path d="M 364 290 Q 364 320 352 345 L 256 340 L 256 290 Z" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
  <!-- Book spine -->
  <line x1="256" y1="290" x2="256" y2="340" stroke="#38bdf8" stroke-width="3"/>
  <!-- Book lines (text) -->
  <line x1="175" y1="308" x2="244" y2="308" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <line x1="175" y1="320" x2="244" y2="320" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <line x1="175" y1="332" x2="235" y2="332" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <line x1="268" y1="308" x2="338" y2="308" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <line x1="268" y1="320" x2="338" y2="320" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <line x1="278" y1="332" x2="338" y2="332" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>

  <!-- OFFLINE badge (bottom-left) -->
  <rect x="62" y="400" width="148" height="46" rx="23" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <circle cx="88" cy="423" r="8" fill="#10b981"/>
  <text x="104" y="428" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34d399">OFFLINE</text>

  <!-- AI badge (bottom-right) -->
  <rect x="302" y="400" width="148" height="46" rx="23" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
  <text x="346" y="428" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">EDGE AI</text>

  <!-- Bottom label -->
  <text x="256" y="486" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748b" text-anchor="middle">SmartLearn Assistant</text>
</svg>

